name: Build Kigali Racing APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk python3-pip unzip wget
        pip install buildozer
    
    - name: Setup Android SDK
      run: |
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools
        mv cmdline-tools cmdline-tools/latest
        
        # Accept ALL licenses
        yes | ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        
        # Install the correct build tools (33.0.0 which is compatible)
        ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
        ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0"
        ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools"
        ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "tools"
        
        # Also install older build tools for compatibility
        ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3"
    
    - name: Setup NDK
      run: |
        cd ~
        wget https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
        unzip -q android-ndk-r23c-linux.zip
    
    - name: Build APK
      env:
        ANDROID_HOME: ~/android-sdk
        ANDROID_NDK_HOME: ~/android-ndk-r23c
        GRADLE_OPTS: -Xmx2048m
      run: |
        # Set PATH to include build tools
        export PATH=$ANDROID_HOME/build-tools/33.0.0:$PATH
        export PATH=$ANDROID_HOME/platform-tools:$PATH
        export PATH=$ANDROID_HOME/tools:$PATH
      
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kigali-racing-apk
        path: bin/*.apk 
