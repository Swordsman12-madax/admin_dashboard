name: Build Kigali Racing APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev
    
    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython
    
    - name: Setup Android SDK
      run: |
        mkdir -p /home/runner/android-sdk
        cd /home/runner/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        # Create correct directory structure
        mkdir -p cmdline-tools
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        # Alternative: just use the extracted folder directly
        echo "y" | cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        echo "y" | cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" 2>/dev/null || true
    
    - name: Download Android NDK
      run: |
        cd /home/runner
        wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
        unzip -q android-ndk-r23c-linux.zip
    
    - name: Build APK
      env:
        ANDROID_HOME: /home/runner/android-sdk
        ANDROID_NDK_HOME: /home/runner/android-ndk-r23c
        GRADLE_OPTS: -Xmx2048m
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kigali-racing-apk
        path: bin/*.apk
        if-no-files-found: error
